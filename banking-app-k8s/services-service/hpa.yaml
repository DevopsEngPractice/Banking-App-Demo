apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: services-hpa
  namespace: banking-app-dev

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: services-deployment

  minReplicas: 2
  maxReplicas: 5

  metrics:
    - type: Resource

      resource:
        name: cpu

        target:
          type: Utilization
          averageUtilization: 70