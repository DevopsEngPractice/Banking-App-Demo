apiVersion: apps/v1
kind: Deployment

metadata:
  name: mongodb-auth
  namespace: banking-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mongodb-auth

  template:
    metadata:
      labels:
        app: mongodb-auth

    spec:
      containers:
        - name: mongodb

          image: mongo:8

          ports:
            - containerPort: 27017

          volumeMounts:
            - name: mongodb-storage
              mountPath: /data/db

      volumes:
        - name: mongodb-storage
          persistentVolumeClaim:
            claimName: auth-mongodb-pvc