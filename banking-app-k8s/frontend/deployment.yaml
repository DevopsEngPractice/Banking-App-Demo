apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: banking-app-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend 
    spec:
      containers:
        - name: frontend
          image: bankingappacr123.azurecr.io/banking-app-frontend:v1.0.${BUILD_NUMBER}
          ports:
            - containerPort: 8080

          livenessProbe:
            httpGet:  
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
    
