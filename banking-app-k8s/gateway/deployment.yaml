apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deployment
  namespace: banking-app-dev
  labels:
    app: gateway
 
spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: gateway

  template: 
    metadata:
      labels:
        app: gateway

    spec:
      securityContext:
        runAsNonRoot: true

      restartPolicy: Always

      containers:
        - name: gateway
          image: bankingappacr123.azurecr.io/banking-app-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env: 
          - name: PORT
            valueFrom:
              configMapKeyRef:
                name: banking-app-config
                key: GATEWAY_PORT

          - name: AUTH_SERVICE_URL
            valueFrom:
              configMapKeyRef:
                name: banking-app-config
                key: AUTH_SERVICE_URL

          - name: OFFERS_SERVICE_URL
            valueFrom:  
              configMapKeyRef:
                name: banking-app-config
                key: OFFERS_SERVICE_URL

          - name: SERVICES_SERVICE_URL
            valueFrom:
              configMapKeyRef:
                name: banking-app-config
                key: SERVICES_SERVICE_URL

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:    
              path: /health
              port: 5000  
            initialDelaySeconds: 30
            periodSeconds: 5

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true