apiVersion: v1
kind: Service

metadata:
  name: gateway
  namespace: {{ .Values.namespace }}

  labels:
    app: gateway

spec:
  type: {{ .Values.gateway.service.type }}

  selector:
    app: gateway

  ports:
    - name: gateway
      port: {{ .Values.gateway.service.port }}
      targetPort: {{ .Values.gateway.service.targetPort }}
      protocol: TCP