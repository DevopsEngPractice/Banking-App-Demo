apiVersion: v1
kind: Service

metadata:
  name: frontend-service
  namespace: {{ .Values.namespace }}

  labels:
    app: frontend

spec:
  selector:
    app: frontend

  ports:
    - name: frontend
      port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.targetPort }}

  type: {{ .Values.frontend.service.type }}