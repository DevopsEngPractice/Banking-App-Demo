namespace: banking-app-dev

global:
  imageRegistry: bankingappacr123.azurecr.io
  imagePullPolicy: IfNotPresent

authService:
  replicaCount: 1

  image:
    repository: banking-app-auth-service
    tag: "v1.0.23"

  service:
    type: ClusterIP
    port: 5001
    targetPort: 5001

  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

  probes:
    liveness:
      path: /health
      initialDelaySeconds: 30
      periodSeconds: 10

    readiness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 5


offersService:
  replicaCount: 1

  image:
    repository: banking-app-offers-service
    tag: "v1.0.23"

  service:
    type: ClusterIP
    port: 5002
    targetPort: 5002

  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"

    limits:
      cpu: "250m"
      memory: "256Mi"

  probes:
    liveness:
      path: /health
      initialDelaySeconds: 30
      periodSeconds: 10

    readiness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 5

servicesService:
  replicaCount: 1

  image:
    repository: banking-app-services-service
    tag: "v1.0.23"

  service:
    type: ClusterIP
    port: 5003
    targetPort: 5003

  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"

    limits:
      cpu: "250m"
      memory: "256Mi"

  probes:
    liveness:
      path: /health
      initialDelaySeconds: 30
      periodSeconds: 10

    readiness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 5

gateway:
  replicaCount: 1

  image:
    repository: banking-app-gateway
    tag: "v1.0.23"

  service:
    type: ClusterIP
    port: 5000
    targetPort: 5000

  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"

    limits:
      cpu: "250m"
      memory: "256Mi"

  probes:
    readiness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 5

    liveness:
      path: /health
      initialDelaySeconds: 30
      periodSeconds: 5

  security:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true

frontend:
  replicaCount: 1

  image:
    repository: banking-app-frontend
    tag: "v1.0.23"

  service:
    type: LoadBalancer
    port: 80
    targetPort: 8080

  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"

    limits:
      cpu: "250m"
      memory: "256Mi"

  probes:
    liveness:
      path: /
      initialDelaySeconds: 30
      periodSeconds: 10

    readiness:
      path: /
      initialDelaySeconds: 5
      periodSeconds: 10

mongodb:
  replicaCount: 1

  image:
    repository: mongo
    tag: "8.0"

  service:
    type: ClusterIP
    port: 27017
    targetPort: 27017

  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"

    limits:
      cpu: "250m"
      memory: "256Mi"

  persistence:
    enabled: true
    storageClass: managed-csi
    accessMode: ReadWriteOnce
    size: 2Gi

resourceQuota:
  enabled: true

  hard:
    requestsCpu: "6"
    requestsMemory: "4Gi"
    limitsCpu: "8"
    limitsMemory: "8Gi"
    pods: "20"    

config:
  auth:
    port: "5001"
    serviceUrl: "http://auth-service:5001"

  offers:
    port: "5002"
    serviceUrl: "http://offers-service:5002"

  services:
    port: "5003"
    serviceUrl: "http://services-service:5003"

  gateway:
    port: "5000"

  frontend:
    clientUrl: "http://frontend-service" 

secrets:

  enabled: true

  authMongoUri: "mongodb://mongodb-service:27017/bank_auth_db"
  offersMongoUri: "mongodb://mongodb-service:27017/bank_offers_db"
  servicesMongoUri: "mongodb://mongodb-service:27017/bank_services_db"
  authJwtSecret: "CHANGE-ME"       
